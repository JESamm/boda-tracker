services:
  - type: web
    name: boda-tracker-api
    runtime: node
    region: singapore
    plan: free
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build --workspace @boda-tracker/api
    startCommand: npm run start --workspace @boda-tracker/api
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: boda-tracker-admin
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: boda-tracker-admin
    runtime: node
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build --workspace @boda-tracker/dashboard
    startCommand: npm run start --workspace @boda-tracker/dashboard
    healthCheckPath: /login
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        fromService:
          name: boda-tracker-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
