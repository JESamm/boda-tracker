name: Deploy to Render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Apply database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "Set the MIGRATION_DATABASE_URL repository secret before deploying." >&2
            exit 1
          fi
          npm run db:deploy --workspace @boda-tracker/api

      - name: Trigger Render API deployment
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_API_DEPLOY_HOOK_URL" ]; then
            echo "Set the RENDER_API_DEPLOY_HOOK_URL repository secret before deploying." >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_API_DEPLOY_HOOK_URL" > /dev/null
